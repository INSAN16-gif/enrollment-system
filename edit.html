<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Enrollment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Edit Enrollment</h1>
    <div class="nav-links"><a href="index.html">Back</a></div>
    <div id="errors"></div>
    <div id="formArea"></div>
  </div>

  <script src="storage.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const r = Number.isInteger(id) && id > 0 ? getRecordById(id) : null;
    const formArea = document.getElementById("formArea");

    if (!r) {
      formArea.innerHTML = '<p class="muted">Record not found.</p>';
    } else {
      formArea.innerHTML = `
        <form id="editForm">
          <div class="form-group">
            <label for="student_number">Student Number</label>
            <input type="text" id="student_number" maxlength="30" required>
          </div>
          <div class="form-group">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="course_name">Course Name</label>
            <input type="text" id="course_name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="semester">Semester</label>
            <input type="text" id="semester" maxlength="50" required>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="Enrolled">Enrolled</option>
              <option value="Dropped">Dropped</option>
            </select>
          </div>
          <button type="submit">Update Enrollment</button>
        </form>
      `;

      document.getElementById("student_number").value = r.student_number;
      document.getElementById("student_name").value = r.student_name;
      document.getElementById("course_name").value = r.course_name;
      document.getElementById("semester").value = r.semester;
      document.getElementById("status").value = r.status;

      document.getElementById("editForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const student_number = document.getElementById("student_number").value.trim();
        const student_name = document.getElementById("student_name").value.trim();
        const course_name = document.getElementById("course_name").value.trim();
        const semester = document.getElementById("semester").value.trim();
        const status = document.getElementById("status").value;
        const errors = [];

        if (!student_number || student_number.length > 30) errors.push("Student number is required (max 30 chars).");
        if (!student_name || student_name.length > 100) errors.push("Student name is required (max 100 chars).");
        if (!course_name || course_name.length > 100) errors.push("Course name is required (max 100 chars).");
        if (!semester || semester.length > 50) errors.push("Semester is required (max 50 chars).");
        if (!["Enrolled", "Dropped"].includes(status)) errors.push("Status must be Enrolled or Dropped.");

        if (errors.length) {
          document.getElementById("errors").innerHTML =
            '<div class="error-box"><ul>' + errors.map(err => `<li>${err}</li>`).join("") + "</ul></div>";
          return;
        }

        updateRecord(r.id, { student_number, student_name, course_name, semester, status });
        location.href = "index.html";
      });
    }
  </script>
</body>
</html>
